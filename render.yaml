services:
  - type: web
    name: fosslib-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: npm run prisma:migrate:deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production

  - type: static_site
    name: fosslib-web
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://${{fosslib-api.RENDER_EXTERNAL_HOSTNAME}}/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html