# FOSSLib Render Blueprint
# Host as a unified full-stack service with zero configuration
services:
  - type: web
    name: fosslib
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm run db:push && npm run seed && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
        # Paste your PostgreSQL URL here (e.g. from Neon or Supabase)
        # Or leave as SQLite file for persistent disk instances: "file:./dev.db"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
